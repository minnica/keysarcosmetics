name: Authenticated development E2E

on:
  workflow_dispatch:
    inputs:
      envelope_sha:
        description: SHA completo servido por Envelope develop
        required: true
        type: string
      finance_sha:
        description: SHA completo servido por Finance develop
        required: true
        type: string
      hr_sha:
        description: SHA completo servido por HR develop
        required: true
        type: string
      payroll_sha:
        description: SHA completo servido por Payroll develop
        required: true
        type: string
      scheduler_sha:
        description: SHA completo servido por Scheduler develop
        required: true
        type: string
      api_sha:
        description: SHA completo desplegado en API development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: authenticated-development-e2e
  cancel-in-progress: false

jobs:
  development-e2e:
    name: Envelope, Payroll and Scheduler read-only journeys
    runs-on: ubuntu-latest
    environment: development
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ENVELOPE_BASE_URL: ${{ vars.ENVELOPE_BASE_URL }}
      FINANCE_BASE_URL: ${{ vars.FINANCE_BASE_URL }}
      HR_BASE_URL: ${{ vars.HR_BASE_URL }}
      PAYROLL_BASE_URL: ${{ vars.PAYROLL_BASE_URL }}
      SCHEDULER_BASE_URL: ${{ vars.SCHEDULER_BASE_URL }}
      ENVELOPE_VERCEL_BYPASS_SECRET: ${{ secrets.ENVELOPE_VERCEL_BYPASS_SECRET }}
      FINANCE_VERCEL_BYPASS_SECRET: ${{ secrets.FINANCE_VERCEL_BYPASS_SECRET }}
      HR_VERCEL_BYPASS_SECRET: ${{ secrets.HR_VERCEL_BYPASS_SECRET }}
      PAYROLL_VERCEL_BYPASS_SECRET: ${{ secrets.PAYROLL_VERCEL_BYPASS_SECRET }}
      SCHEDULER_VERCEL_BYPASS_SECRET: ${{ secrets.SCHEDULER_VERCEL_BYPASS_SECRET }}
      E2E_ENVELOPE_EMAIL: ${{ secrets.E2E_ENVELOPE_EMAIL }}
      E2E_ENVELOPE_PASSWORD: ${{ secrets.E2E_ENVELOPE_PASSWORD }}
      E2E_PAYROLL_EMAIL: ${{ secrets.E2E_PAYROLL_EMAIL }}
      E2E_PAYROLL_PASSWORD: ${{ secrets.E2E_PAYROLL_PASSWORD }}
      E2E_SCHEDULER_EMAIL: ${{ secrets.E2E_SCHEDULER_EMAIL }}
      E2E_SCHEDULER_PASSWORD: ${{ secrets.E2E_SCHEDULER_PASSWORD }}
      E2E_EXPECTED_ENVELOPE_SHA: ${{ inputs.envelope_sha }}
      E2E_EXPECTED_FINANCE_SHA: ${{ inputs.finance_sha }}
      E2E_EXPECTED_HR_SHA: ${{ inputs.hr_sha }}
      E2E_EXPECTED_PAYROLL_SHA: ${{ inputs.payroll_sha }}
      E2E_EXPECTED_SCHEDULER_SHA: ${{ inputs.scheduler_sha }}
      E2E_EXPECTED_API_SHA: ${{ inputs.api_sha }}
      RELEASE_MANIFEST_ENVIRONMENT: development
      RELEASE_MANIFEST_PATH: apps/e2e/release-manifest-development.json
    steps:
      - name: Validate release identity and development configuration
        run: |
          [[ "$E2E_EXPECTED_ENVELOPE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$E2E_EXPECTED_FINANCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$E2E_EXPECTED_HR_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$E2E_EXPECTED_PAYROLL_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$E2E_EXPECTED_SCHEDULER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$E2E_EXPECTED_API_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$API_BASE_URL"
          test -n "$ENVELOPE_BASE_URL"
          test -n "$FINANCE_BASE_URL"
          test -n "$HR_BASE_URL"
          test -n "$PAYROLL_BASE_URL"
          test -n "$SCHEDULER_BASE_URL"
          test -n "$ENVELOPE_VERCEL_BYPASS_SECRET"
          test -n "$FINANCE_VERCEL_BYPASS_SECRET"
          test -n "$HR_VERCEL_BYPASS_SECRET"
          test -n "$PAYROLL_VERCEL_BYPASS_SECRET"
          test -n "$SCHEDULER_VERCEL_BYPASS_SECRET"
          test -n "$E2E_ENVELOPE_EMAIL"
          test -n "$E2E_ENVELOPE_PASSWORD"
          test -n "$E2E_PAYROLL_EMAIL"
          test -n "$E2E_PAYROLL_PASSWORD"
          test -n "$E2E_SCHEDULER_EMAIL"
          test -n "$E2E_SCHEDULER_PASSWORD"
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm --filter @cosmetics/e2e exec playwright install --with-deps chromium
      - name: Run authenticated read-only journeys
        run: pnpm test:e2e:development
      - name: Remove reusable sessions before publishing diagnostics
        if: always()
        run: |
          rm -f apps/e2e/.auth/envelope.json
          rm -f apps/e2e/.auth/payroll.json
          rm -f apps/e2e/.auth/scheduler.json
      - name: Publish safe Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-development-e2e-report
          path: apps/e2e/playwright-report-development
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish verified environment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_MANIFEST_PATH }}
          if-no-files-found: ignore
          retention-days: 30
