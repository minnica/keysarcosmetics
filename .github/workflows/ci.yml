name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cosmetics_ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/cosmetics_ci?schema=public
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

jobs:
  shared-ui-contracts:
    name: Shared UI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run UI contracts and record duration
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:ui:coverage
          status=$?
          duration_seconds=$(($(date +%s) - started_at))
          {
            echo "### Shared UI contracts"
            echo ""
            echo "| Métrica | Valor |"
            echo "| --- | --- |"
            echo "| Duración | ${duration_seconds}s |"
            echo "| Intento del workflow | $GITHUB_RUN_ATTEMPT |"
            echo "| Retries | 0 |"
            echo "| Resultado | $([ "$status" -eq 0 ] && echo verde || echo falló) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  ui-regression-canaries:
    name: UI regression canaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cosmetics/e2e exec playwright install --with-deps chromium
      - name: Run visual canaries and record duration
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:ui:visual
          status=$?
          duration_seconds=$(($(date +%s) - started_at))
          {
            echo "### UI regression canaries"
            echo ""
            echo "| Métrica | Valor |"
            echo "| --- | --- |"
            echo "| Duración | ${duration_seconds}s |"
            echo "| Intento del workflow | $GITHUB_RUN_ATTEMPT |"
            echo "| Retries máximos | 1 |"
            echo "| Resultado | $([ "$status" -eq 0 ] && echo verde || echo falló) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-regression-artifacts
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git diff --check
      - if: github.event_name == 'pull_request'
        run: pnpm migrations:review -- origin/${{ github.base_ref }}
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit

  build:
    name: Production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo:graph:verify
      - run: pnpm deploy:impact:test
      - run: pnpm deploy:release-manifest:test
      - run: pnpm ci:build

  database-integration:
    name: Migrations and API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosmetics_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmetics_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cosmetics/api prisma:schemas
      - run: pnpm --filter @cosmetics/api prisma:validate
      - run: pnpm --filter @cosmetics/api db:migrate:deploy
      - name: Verify the Scheduler upgrade from the 39-migration snapshot
        env:
          SCHEDULER_MIGRATION_FIXTURE_CONFIRMATION: EPHEMERAL_ONLY
          SCHEDULER_UPGRADE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cosmetics_ci?schema=scheduler_upgrade_ci
        run: scripts/verify-scheduler-migration-path.sh
      - run: pnpm test:integration
        env:
          RUN_DATABASE_TESTS: true
          JWT_SECRET: integration-test-secret-with-adequate-length
      - name: Run the Scheduler 30-branch load gate
        run: pnpm --filter @cosmetics/api test:scheduler:load
        env:
          RUN_SCHEDULER_LOAD_TESTS: true
          SCHEDULER_LOAD_MAX_MS: 30000
          JWT_SECRET: integration-test-secret-with-adequate-length
