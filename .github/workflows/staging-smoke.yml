name: Environment smoke tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de lectura
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: smoke-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  smoke:
    name: API, Envelope and Payroll
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ENVELOPE_BASE_URL: ${{ vars.ENVELOPE_BASE_URL }}
      PAYROLL_BASE_URL: ${{ vars.PAYROLL_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate environment URLs
        run: |
          test -n "$API_BASE_URL"
          test -n "$ENVELOPE_BASE_URL"
          test -n "$PAYROLL_BASE_URL"
      - run: pnpm test:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
