name: Environment smoke tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de lectura
        required: true
        type: choice
        options:
          - development
          - production
      release_sha:
        description: SHA completo servido por Envelope, Payroll y Scheduler
        required: true
        type: string
      api_sha:
        description: SHA completo servido por /health en la API
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  smoke:
    name: API, Envelope, Payroll and Scheduler
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ENVELOPE_BASE_URL: ${{ vars.ENVELOPE_BASE_URL }}
      PAYROLL_BASE_URL: ${{ vars.PAYROLL_BASE_URL }}
      SCHEDULER_BASE_URL: ${{ vars.SCHEDULER_BASE_URL }}
      ENVELOPE_VERCEL_BYPASS_SECRET: ${{ secrets.ENVELOPE_VERCEL_BYPASS_SECRET }}
      PAYROLL_VERCEL_BYPASS_SECRET: ${{ secrets.PAYROLL_VERCEL_BYPASS_SECRET }}
      SCHEDULER_VERCEL_BYPASS_SECRET: ${{ secrets.SCHEDULER_VERCEL_BYPASS_SECRET }}
      SMOKE_EXPECTED_FRONTEND_SHA: ${{ inputs.release_sha }}
      SMOKE_EXPECTED_API_SHA: ${{ inputs.api_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate environment URLs
        run: |
          [[ "$SMOKE_EXPECTED_FRONTEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SMOKE_EXPECTED_API_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$API_BASE_URL"
          test -n "$ENVELOPE_BASE_URL"
          test -n "$PAYROLL_BASE_URL"
          test -n "$SCHEDULER_BASE_URL"
          if [ "$TARGET_ENVIRONMENT" = "development" ]; then
            test -n "$ENVELOPE_VERCEL_BYPASS_SECRET"
            test -n "$PAYROLL_VERCEL_BYPASS_SECRET"
            test -n "$SCHEDULER_VERCEL_BYPASS_SECRET"
          fi
      - name: Run public smoke and record duration
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:smoke
          status=$?
          duration_seconds=$(($(date +%s) - started_at))
          {
            echo "### Environment smoke tests"
            echo ""
            echo "| Métrica | Valor |"
            echo "| --- | --- |"
            echo "| Ambiente | $TARGET_ENVIRONMENT |"
            echo "| Duración | ${duration_seconds}s |"
            echo "| Intento del workflow | $GITHUB_RUN_ATTEMPT |"
            echo "| Resultado | $([ "$status" -eq 0 ] && echo verde || echo falló) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  production-authenticated-smoke:
    name: Authenticated production smoke
    if: inputs.environment == 'production'
    needs: smoke
    runs-on: ubuntu-latest
    environment: production
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ENVELOPE_BASE_URL: ${{ vars.ENVELOPE_BASE_URL }}
      PAYROLL_BASE_URL: ${{ vars.PAYROLL_BASE_URL }}
      ENVELOPE_VERCEL_BYPASS_SECRET: ${{ secrets.ENVELOPE_VERCEL_BYPASS_SECRET }}
      PAYROLL_VERCEL_BYPASS_SECRET: ${{ secrets.PAYROLL_VERCEL_BYPASS_SECRET }}
      PRODUCTION_MONITOR_ENVELOPE_EMAIL: ${{ secrets.PRODUCTION_MONITOR_ENVELOPE_EMAIL }}
      PRODUCTION_MONITOR_ENVELOPE_PASSWORD: ${{ secrets.PRODUCTION_MONITOR_ENVELOPE_PASSWORD }}
      PRODUCTION_MONITOR_PAYROLL_EMAIL: ${{ secrets.PRODUCTION_MONITOR_PAYROLL_EMAIL }}
      PRODUCTION_MONITOR_PAYROLL_PASSWORD: ${{ secrets.PRODUCTION_MONITOR_PAYROLL_PASSWORD }}
    steps:
      - name: Validate production monitoring configuration
        run: |
          test -n "$API_BASE_URL"
          test -n "$ENVELOPE_BASE_URL"
          test -n "$PAYROLL_BASE_URL"
          test -n "$PRODUCTION_MONITOR_ENVELOPE_EMAIL"
          test -n "$PRODUCTION_MONITOR_ENVELOPE_PASSWORD"
          test -n "$PRODUCTION_MONITOR_PAYROLL_EMAIL"
          test -n "$PRODUCTION_MONITOR_PAYROLL_PASSWORD"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm --filter @cosmetics/e2e exec playwright install --with-deps chromium
      - name: Run authenticated read-only production smoke
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:production
          status=$?
          duration_seconds=$(($(date +%s) - started_at))
          {
            echo "### Authenticated production smoke"
            echo ""
            echo "| Métrica | Valor |"
            echo "| --- | --- |"
            echo "| Recorridos | 3 Envelope + 3 Payroll |"
            echo "| Duración | ${duration_seconds}s |"
            echo "| Intento del workflow | $GITHUB_RUN_ATTEMPT |"
            echo "| Retries | 0 |"
            echo "| Resultado | $([ "$status" -eq 0 ] && echo verde || echo falló) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Remove sessions and non-published diagnostics
        if: always()
        run: |
          rm -f apps/e2e/.auth/production-envelope.json
          rm -f apps/e2e/.auth/production-payroll.json
          if [ -d apps/e2e/test-results/production ]; then
            rm -r -- apps/e2e/test-results/production
          fi
