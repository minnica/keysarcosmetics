app = 'cosmetics-api'
primary_region = 'dfw'

[build]

[deploy]
  strategy = 'rolling'

[env]
  PORT = '4000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '15s'
  interval = '15s'
  method = 'GET'
  path = '/ready'
  timeout = '3s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
